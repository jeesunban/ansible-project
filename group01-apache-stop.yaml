---
- name: APACHE STOP for 서울시
  hosts: group01
  serial: 1
  gather_facts: false
  tasks:
  - name: BLOCK - APACHE 중지
    block:
    - name: get APACHE directory list
      ansible.builtin.find:
        paths: "{{ apps_dir }}"
        recurse: false
        file_type: directory
      register: apache_dirs
    - ansible.builtin.debug:
        var: apache_dirs.files | map(attribute='path')
    - name: include normal playbook
      include_tasks: x11-apache-stop.yaml
      loop: "{{ apache_dirs.files | map(attribute='path') }}"
    when: "'group01' in target_groups"
    any_errors_fatal: true
