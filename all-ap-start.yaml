---
- name: JBoss start
  hosts:
    - group01
    - group02

  serial: 1
  gather_facts: false
  any_errors_fatal: true

  become: true
  become_user: jboss

  vars:
    jboss_base_dir: "/APP/JBOSS/domain"

  tasks:

    - name: 그룹 내 호스트 순번 계산
      ansible.builtin.set_fact:
        host_seq: "{{ groups[group_names[0]].index(inventory_hostname) + 1 }}"

    - name: JBoss 시작 번호 계산
      ansible.builtin.set_fact:
        host_index: "{{ host_seq | int * 10 }}"

    - name: 대상 JBoss 목록 생성
      ansible.builtin.set_fact:
        target_jboss:
          - "AP_sbms{{ host_index }}"
          - "AP_sbms{{ host_index | int + 1 }}"
          - "AP_sbms{{ host_index | int + 2 }}"

    - name: 매핑 확인
      ansible.builtin.debug:
        msg:
          - "HOST={{ inventory_hostname }}"
          - "HOST_SEQ={{ host_seq }}"
          - "TARGET={{ target_jboss }}"

    - name: JBoss start
      ansible.builtin.shell: "./start.sh"
      args:
        chdir: "{{ jboss_base_dir }}/{{ item }}/bin"
      loop: "{{ target_jboss }}"
      register: start_result
      ignore_errors: true

    - name: start result
      ansible.builtin.debug:
        msg:
          - "HOST={{ inventory_hostname }}"
          - "JBOSS={{ item.item }}"
          - "RC={{ item.rc }}"
      loop: "{{ start_result.results }}"
